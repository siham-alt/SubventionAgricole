<div class="page">
  <h1>Mon profil</h1>

  <div class="card">
    <div class="profil-header">
 <label class="avatar-large-wrapper">
  @if (auth.currentUser()?.photo_profil) {
    <img [src]="photoUrl()" class="avatar-img" />
  } @else {
    <div class="avatar-large">{{ auth.currentUser()?.name?.charAt(0) }}</div>
  }
  <span class="avatar-edit-badge">📷</span>
  <input type="file" accept="image/*" (change)="onPhotoSelectionnee($event)" hidden />
</label>
  <div>
    <h2>{{ auth.currentUser()?.name }}</h2>
    <p>{{ auth.currentUser()?.email }}</p>
  </div>
</div>

    @if (successMessage()) {
      <div class="alert alert-success">{{ successMessage() }}</div>
    }
    @if (errorMessage()) {
      <div class="alert alert-danger">{{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
      <div class="form-group">
        <label>Nom complet</label>
        <input type="text" formControlName="name" />
      </div>
      <div class="form-group">
        <label>Téléphone</label>
        <input type="text" formControlName="telephone" />
      </div>
      <div class="form-group full-width">
        <label>Adresse</label>
        <input type="text" formControlName="adresse" />
      </div>
      <div class="form-group">
        <label>Région</label>
        <input type="text" formControlName="region" />
      </div>
      <div class="form-group">
        <label>Province</label>
        <input type="text" formControlName="province" />
      </div>
      <div class="form-group">
        <label>Commune</label>
        <input type="text" formControlName="commune" />
      </div>

      <div class="form-actions full-width">
        <button type="submit" class="btn-primary" [disabled]="loading()">
          {{ loading() ? 'Enregistrement...' : 'Enregistrer les modifications' }}
        </button>
      </div>
    </form>
  </div>
</div>
